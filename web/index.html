<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef2e9">
  <title>暖暖 · 聊一会儿</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23436957'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='white' font-size='44'%3E✳%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="暖暖首页"><span class="brand-mark">✳</span><span>暖暖<small>NUAN</small></span></a>
  <div class="header-right"><span id="connection" role="status">正在连接</span><button id="reconnect" hidden>重新连接</button><button id="reset" class="quiet">重新开始</button></div>
</header>
<main>
  <section class="stage" aria-label="数字人">
    <div class="stage-heading"><span class="eyebrow">SOME TIME TOGETHER</span><h1>慢慢说，<br>我在听。</h1></div>
    <div id="avatar"><img class="placeholder" src="/static/assets/portrait.jpg" alt="暖暖 AI 数字人"></div>
    <div id="avatar-loading">暖暖正在准备与你见面…</div>
    <div class="identity"><span class="presence"></span><div><strong>暖暖</strong><small>愿意倾听的 AI 伙伴</small></div></div>
    <div id="caption" hidden aria-live="polite"></div>
    <div id="state-label">慢慢来，聊你想聊的。</div>
  </section>
  <section class="conversation" aria-label="聊天">
    <div class="conversation-heading"><span class="eyebrow">LET'S TALK</span><h2>今天，想聊些什么？</h2><p>一件小事，一个念头，都可以。</p></div>
    <div id="messages" aria-live="polite" aria-relevant="additions text"></div>
    <div class="composer">
      <p id="error" role="alert" hidden></p>
      <form id="message-form"><label class="sr-only" for="text-input">消息</label><textarea id="text-input" rows="2" maxlength="1500" placeholder="把想说的话写在这里…" autofocus></textarea><button id="send" type="submit" aria-label="发送消息" disabled>↑</button></form>
      <div class="actions"><button id="mic" class="primary" disabled>♩ 开始说话</button><button id="interrupt" disabled>暂停回复</button><span id="record-status" role="status"></span></div>
      <div class="mic-options"><label for="mic-device">麦克风</label><select id="mic-device"><option value="default">系统默认麦克风</option></select></div>
      <p class="note">暖暖是 AI。聊天内容只在本次连接中保留。</p>
    </div>
  </section>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
